<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thermal Receipt - Bill #{{ bill_id }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.3;
      color: #000;
      background: #e0e0e0;
      padding: 10px 0;
    }

    .receipt-container {
      width: {{ '220px' if width == '58' else '300px' }};
      margin: 0 auto;
      background: #fff;
      padding: 8px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    @media print {
      body {
        background: #fff;
        margin: 0;
        padding: 0;
      }
      .receipt-container {
        width: 100%;
        margin: 0;
        padding: 4px 6px;
        box-shadow: none;
      }
      .no-print {
        display: none !important;
      }
      @page {
        size: {{ width }}mm auto;
        margin: 0;
      }
    }

    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .text-left { text-align: left; }
    .bold { font-weight: bold; }

    .divider-dash {
      border-bottom: 1px dashed #000;
      margin: 6px 0;
    }
    .divider-double {
      border-bottom: 2px solid #000;
      margin: 6px 0;
    }

    .receipt-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
    }

    .receipt-table th, .receipt-table td {
      padding: 2px 0;
      vertical-align: top;
    }

    .no-print-toolbar {
      position: fixed;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
      z-index: 9999;
    }

    .toolbar-btn {
      padding: 6px 12px;
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
      border-radius: 4px;
      cursor: pointer;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 600;
    }
    .toolbar-btn:hover {
      background: #333;
    }
  </style>
</head>
<body>

<div class="no-print no-print-toolbar">
  <button class="toolbar-btn" onclick="toggleWidth()">Paper: {{ width }}mm</button>
  <button class="toolbar-btn" onclick="window.print()">🖨️ Print</button>
  <button class="toolbar-btn" onclick="window.close()">✕ Close</button>
</div>

<div class="receipt-container" id="receipt">
  <div id="receipt-content" class="text-center" style="padding: 20px 0;">Loading thermal receipt...</div>
</div>

<script>
  const billId = {{ bill_id }};
  const paperWidth = "{{ width }}";

  function toggleWidth() {
    const nextWidth = paperWidth === '80' ? '58' : '80';
    window.location.href = `/invoice/${billId}/thermal?width=${nextWidth}`;
  }

  function fmt(n, d = 2) {
    return parseFloat(n || 0).toFixed(d);
  }

  function fmtDate(dt) {
    if (!dt) return '';
    const d = new Date(dt);
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' +
           d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
  }

  async function loadReceipt() {
    try {
      const res = await fetch('/api/bills/' + billId);
      const json = await res.json();
      if (json.status === 'error') throw new Error(json.message);
      renderReceipt(json.data);
      setTimeout(() => {
        if (json.data.settings && json.data.settings.print_after_bill === 'true') {
          window.print();
        }
      }, 400);
    } catch(e) {
      document.getElementById('receipt-content').innerHTML =
        '<div style="color:red; text-align:center;">Error: ' + e.message + '</div>';
    }
  }

  function renderReceipt(data) {
    const s = data.settings || {};
    const isGstGlobal = s.gst_enabled !== 'false' && s.gst_enabled !== false;
    const shopName = s.shop_name || 'Meat Products of India';
    const shopAddr = s.shop_address || '';
    const shopPhone = s.shop_phone || '';
    const shopGstin = isGstGlobal ? (s.shop_gstin || '') : '';
    const footerText = s.receipt_footer_text || 'Thank you, visit again!';

    const items = data.items || [];
    const payments = data.payments || [];
    const isInterstate = data.is_interstate == 1 || data.is_interstate === true;

    let paymentInfo = '';
    if (payments.length > 1) {
      paymentInfo = payments.map(p => `${(p.payment_mode || 'cash').toUpperCase()}: ₹${fmt(p.amount)}`).join('<br>');
    } else {
      paymentInfo = (data.payment_mode || 'cash').toUpperCase();
    }

    let itemsHtml = '';
    items.forEach((it) => {
      const name = it.product_name || '';
      const qtyStr = `${fmt(it.quantity, 3)} ${it.unit || ''} x ₹${fmt(it.unit_price)}`;
      const amtStr = `₹${fmt(it.amount)}`;
      itemsHtml += `
        <tr>
          <td colspan="2" class="bold">${name}</td>
        </tr>
        <tr>
          <td style="padding-bottom: 4px;">${qtyStr}</td>
          <td class="text-right bold" style="padding-bottom: 4px;">${amtStr}</td>
        </tr>
      `;
    });

    let gstBreakupHtml = '';
    if (isGstGlobal) {
      if (isInterstate) {
        if (data.igst > 0) {
          gstBreakupHtml += `
            <tr>
              <td>IGST:</td>
              <td class="text-right">₹${fmt(data.igst)}</td>
            </tr>`;
        }
      } else {
        if (data.cgst > 0) {
          gstBreakupHtml += `
            <tr>
              <td>CGST:</td>
              <td class="text-right">₹${fmt(data.cgst)}</td>
            </tr>`;
        }
        if (data.sgst > 0) {
          gstBreakupHtml += `
            <tr>
              <td>SGST:</td>
              <td class="text-right">₹${fmt(data.sgst)}</td>
            </tr>`;
        }
      }
    }

    const html = `
      <div class="text-center">
        <div class="bold" style="font-size: 14px; text-transform: uppercase;">${shopName}</div>
        ${shopAddr ? `<div style="font-size: 10px;">${shopAddr}</div>` : ''}
        ${shopPhone ? `<div style="font-size: 10px;">Ph: ${shopPhone}</div>` : ''}
        ${shopGstin ? `<div style="font-size: 10px;" class="bold">GSTIN: ${shopGstin}</div>` : ''}
      </div>

      <div class="divider-dash"></div>

      <div style="font-size: 11px;">
        <div><span class="bold">Bill No:</span> ${data.bill_no}</div>
        <div><span class="bold">Date:</span> ${fmtDate(data.date)}</div>
        ${data.customer_name ? `<div><span class="bold">Cust:</span> ${data.customer_name}</div>` : ''}
        ${data.customer_phone ? `<div><span class="bold">Ph:</span> ${data.customer_phone}</div>` : ''}
      </div>

      <div class="divider-dash"></div>

      <table class="receipt-table">
        <thead>
          <tr style="border-bottom: 1px dashed #000;">
            <th class="text-left">Item / Qty</th>
            <th class="text-right">Amt</th>
          </tr>
        </thead>
        <tbody>
          ${itemsHtml}
        </tbody>
      </table>

      <div class="divider-dash"></div>

      <table class="receipt-table">
        <tr>
          <td>Subtotal:</td>
          <td class="text-right">₹${fmt(data.subtotal)}</td>
        </tr>
        ${data.discount_amount > 0 ? `
          <tr>
            <td>Discount (${fmt(data.discount_percent)}%):</td>
            <td class="text-right">-₹${fmt(data.discount_amount)}</td>
          </tr>` : ''}
        ${gstBreakupHtml}
      </table>

      <div class="divider-double"></div>

      <table class="receipt-table" style="font-size: 12px;">
        <tr class="bold">
          <td>GRAND TOTAL:</td>
          <td class="text-right" style="font-size: 14px;">₹${fmt(data.grand_total)}</td>
        </tr>
        <tr>
          <td>Paid (${paymentInfo}):</td>
          <td class="text-right">₹${fmt(data.amount_paid)}</td>
        </tr>
        ${data.amount_due > 0 ? `
          <tr class="bold">
            <td>AMOUNT DUE:</td>
            <td class="text-right">₹${fmt(data.amount_due)}</td>
          </tr>` : ''}
        ${data.change_amount > 0 ? `
          <tr>
            <td>Change Returned:</td>
            <td class="text-right">₹${fmt(data.change_amount)}</td>
          </tr>` : ''}
      </table>

      <div class="divider-dash"></div>

      <div class="text-center" style="font-size: 11px; margin-top: 6px;">
        <div>${footerText}</div>
      </div>
    `;

    document.getElementById('receipt').innerHTML = html;
  }

  loadReceipt();
</script>
</body>
</html>
